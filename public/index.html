<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FemogNotes — Master AI & Agentic Systems Engineering Reference</title>
  <meta name="description" content="FemogNotes: Comprehensive technical reference guide for AI Orchestration, Multi-Agent Systems, AI Coding Workflows, Prompt Engineering, and Spec-Driven Development.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Marked JS for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- KaTeX for LaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- Highlight.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css" id="hljs-theme">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #7dd3fc;
      --sidebar-width: 320px;
      --header-height: 64px;
      --code-bg: #0f172a;
      --table-stripe: #1e293b;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --panel-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --code-bg: #f1f5f9;
      --table-stripe: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .brand-icon {
      font-size: 1.5rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.4rem 0.8rem 0.4rem 2.2rem;
      border-radius: 8px;
      font-size: 0.875rem;
      outline: none;
      width: 220px;
      transition: width 0.2s, border-color 0.2s;
    }

    .search-box input:focus {
      width: 300px;
      border-color: var(--accent-color);
    }

    .search-box svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      fill: var(--text-muted);
      width: 14px;
      height: 14px;
    }

    .btn-icon {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    /* Layout */
    .app-container {
      display: flex;
      margin-top: var(--header-height);
      min-height: calc(100vh - var(--header-height));
    }

    /* Sidebar Navigation */
    sidebar {
      width: var(--sidebar-width);
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      position: fixed;
      top: var(--header-height);
      bottom: 0;
      left: 0;
      overflow-y: auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .toc-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      padding-left: 0.5rem;
    }

    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .toc-item a {
      display: block;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toc-item a:hover, .toc-item a.active {
      background: var(--bg-color);
      color: var(--accent-color);
      font-weight: 500;
    }

    .toc-item.level-2 a { padding-left: 0.75rem; font-weight: 600; }
    .toc-item.level-3 a { padding-left: 1.5rem; font-size: 0.825rem; }

    /* Main Content Area */
    main {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 2.5rem 3rem;
      max-width: 960px;
    }

    /* Markdown Styling */
    .markdown-body {
      font-size: 1rem;
      color: var(--text-main);
    }

    .markdown-body h1 {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--border-color);
      color: var(--text-main);
      letter-spacing: -0.025em;
    }

    .markdown-body h2 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--accent-color);
      scroll-margin-top: calc(var(--header-height) + 1rem);
    }

    .markdown-body h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 1.75rem;
      margin-bottom: 0.75rem;
      color: var(--text-main);
      scroll-margin-top: calc(var(--header-height) + 1rem);
    }

    .markdown-body h4 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .markdown-body p {
      margin-bottom: 1.25rem;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 1.25rem;
      padding-left: 1.5rem;
    }

    .markdown-body li {
      margin-bottom: 0.4rem;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent-color);
      padding: 0.75rem 1.25rem;
      background: var(--panel-bg);
      border-radius: 0 8px 8px 0;
      margin-bottom: 1.5rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .markdown-body code {
      font-family: 'JetBrains Mono', monospace;
      background: var(--code-bg);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.875em;
      border: 1px solid var(--border-color);
    }

    .markdown-body pre {
      background: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.25rem;
      overflow-x: auto;
      margin-bottom: 1.5rem;
    }

    .markdown-body pre code {
      background: transparent;
      padding: 0;
      border: none;
      font-size: 0.875rem;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      background: var(--panel-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .markdown-body th, .markdown-body td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .markdown-body th {
      background: var(--bg-color);
      font-weight: 600;
      color: var(--accent-color);
    }

    .markdown-body tr:nth-child(even) {
      background: var(--table-stripe);
    }

    .markdown-body hr {
      border: 0;
      height: 1px;
      background: var(--border-color);
      margin: 2.5rem 0;
    }

    .markdown-body strong {
      color: var(--accent-hover);
    }

    /* Mobile Drawer */
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.5rem;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 99;
      }
      sidebar.open {
        transform: translateX(0);
      }
      main {
        margin-left: 0;
        padding: 1.5rem;
      }
      .mobile-menu-btn {
        display: block;
      }
      .search-box input {
        width: 140px;
      }
      .search-box input:focus {
        width: 180px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="brand">
        <span class="brand-icon">🧠</span>
        <span>FemogNotes</span>
      </div>
    </div>

    <div class="header-actions">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" placeholder="Search notes..." onkeyup="filterContent()">
      </div>
      <button class="btn-icon" onclick="toggleTheme()">
        <span id="themeIcon">☀️</span>
        <span id="themeLabel">Light</span>
      </button>
    </div>
  </header>

  <div class="app-container">
    <sidebar id="sidebar">
      <div class="toc-title">Table of Contents</div>
      <ul class="toc-list" id="tocList">
        <!-- Generated dynamically -->
      </ul>
    </sidebar>

    <main>
      <article class="markdown-body" id="content">
        <p style="color: var(--text-muted);">Loading notes content...</p>
      </article>
    </main>
  </div>

  <script>
    // Theme toggle logic
    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') !== 'light';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      
      document.getElementById('themeIcon').textContent = isDark ? '🌙' : '☀️';
      document.getElementById('themeLabel').textContent = isDark ? 'Dark' : 'Light';
      document.getElementById('hljs-theme').href = isDark 
        ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css'
        : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css';
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // Custom renderer for marked to build TOC and support KaTeX
    function renderMarkdown(markdownText) {
      const contentEl = document.getElementById('content');
      const tocListEl = document.getElementById('tocList');
      
      // Parse markdown
      contentEl.innerHTML = marked.parse(markdownText);

      // Apply syntax highlighting
      document.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });

      // Render KaTeX math
      document.querySelectorAll('.markdown-body').forEach((el) => {
        // Render inline math $...$
        el.innerHTML = el.innerHTML.replace(/\$([^\$]+)\$/g, (match, math) => {
          try {
            return katex.renderToString(math, { displayMode: false });
          } catch (e) {
            return match;
          }
        });
      });

      // Generate Table of Contents from h2 and h3 elements
      tocListEl.innerHTML = '';
      const headings = contentEl.querySelectorAll('h2, h3');
      headings.forEach((heading, idx) => {
        const id = 'heading-' + idx;
        heading.id = id;

        const li = document.createElement('li');
        li.className = 'toc-item ' + (heading.tagName === 'H2' ? 'level-2' : 'level-3');
        
        const a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = heading.textContent.replace(/^Section \d+:\s*/, '');
        a.onclick = () => {
          if (window.innerWidth <= 900) toggleSidebar();
        };

        li.appendChild(a);
        tocListEl.appendChild(li);
      });
    }

    // Filter content on search
    function filterContent() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const headings = document.querySelectorAll('.markdown-body h2, .markdown-body h3, .markdown-body p, .markdown-body li');
      
      if (!query) {
        headings.forEach(el => el.style.display = '');
        return;
      }

      headings.forEach(el => {
        const text = el.textContent.toLowerCase();
        if (text.includes(query)) {
          el.style.display = '';
        } else {
          el.style.display = 'none';
        }
      });
    }

    // Fetch markdown file or fall back to embedded data
    fetch('ai_notes.md')
      .then(response => {
        if (!response.ok) throw new Error('Network response error');
        return response.text();
      })
      .then(text => renderMarkdown(text))
      .catch(err => {
        console.error('Fetch error:', err);
      });
  </script>
</body>
</html>
