<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>FemogNotes — Master AI & Agentic Systems Engineering Reference</title>
  <meta name="description" content="FemogNotes: Comprehensive technical reference guide for AI Orchestration, Multi-Agent Systems, AI Coding Workflows, Prompt Engineering, and Spec-Driven Development.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Marked JS for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- KaTeX for LaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- Highlight.js for syntax highlighting (Default: Light Theme) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css" id="hljs-theme">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-color: #f8fafc;
      --panel-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --sidebar-width: 300px;
      --header-height: 64px;
      --code-bg: #f1f5f9;
      --table-stripe: #f8fafc;
      --error-color: #ef4444;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #7dd3fc;
      --code-bg: #0f172a;
      --table-stripe: #1e293b;
      --error-color: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Passcode Lock Modal Overlay */
    .lock-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-color);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .lock-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .lock-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .lock-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .lock-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .lock-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .passcode-input-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .passcode-input {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 0.2em;
      outline: none;
      transition: border-color 0.2s ease;
      width: 100%;
    }

    .passcode-input:focus {
      border-color: var(--accent-color);
    }

    .passcode-btn {
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .passcode-btn:hover {
      background: var(--accent-hover);
    }

    .error-msg {
      color: var(--error-color);
      font-size: 0.85rem;
      display: none;
    }

    .error-msg.visible {
      display: block;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-main);
      text-decoration: none;
    }

    .brand-icon {
      font-size: 1.4rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.45rem 0.8rem 0.45rem 2.2rem;
      border-radius: 8px;
      font-size: 0.875rem;
      outline: none;
      width: 220px;
      transition: width 0.2s ease, border-color 0.2s ease;
    }

    .search-box input:focus {
      width: 280px;
      border-color: var(--accent-color);
    }

    .search-box svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      fill: var(--text-muted);
      width: 14px;
      height: 14px;
      pointer-events: none;
    }

    .btn-icon {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-icon:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    /* Layout */
    .app-container {
      display: flex;
      margin-top: var(--header-height);
      min-height: calc(100vh - var(--header-height));
      width: 100%;
    }

    /* Sidebar Navigation */
    sidebar {
      width: var(--sidebar-width);
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      position: fixed;
      top: var(--header-height);
      bottom: 0;
      left: 0;
      overflow-y: auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 90;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: var(--header-height);
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      z-index: 85;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .toc-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      padding-left: 0.5rem;
    }

    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .toc-item a {
      display: block;
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .toc-item a:hover, .toc-item a.active {
      background: var(--bg-color);
      color: var(--accent-color);
      font-weight: 600;
    }

    .toc-item.level-2 a { padding-left: 0.5rem; font-weight: 600; color: var(--text-main); }
    .toc-item.level-3 a { padding-left: 1.25rem; font-size: 0.825rem; }

    /* Main Content Area */
    main {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 2.5rem 3rem;
      max-width: 1000px;
      width: calc(100% - var(--sidebar-width));
    }

    /* Markdown Body Styling */
    .markdown-body {
      font-size: 1rem;
      color: var(--text-main);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .markdown-body h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 800;
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--border-color);
      color: var(--text-main);
      letter-spacing: -0.025em;
    }

    .markdown-body h2 {
      font-size: clamp(1.3rem, 3vw, 1.5rem);
      font-weight: 700;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--accent-color);
      scroll-margin-top: calc(var(--header-height) + 1.5rem);
    }

    .markdown-body h3 {
      font-size: clamp(1.1rem, 2.5vw, 1.25rem);
      font-weight: 600;
      margin-top: 1.75rem;
      margin-bottom: 0.75rem;
      color: var(--text-main);
      scroll-margin-top: calc(var(--header-height) + 1.5rem);
    }

    .markdown-body h4 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .markdown-body p {
      margin-bottom: 1.25rem;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 1.25rem;
      padding-left: 1.5rem;
    }

    .markdown-body li {
      margin-bottom: 0.4rem;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--accent-color);
      padding: 0.75rem 1.25rem;
      background: var(--panel-bg);
      border-radius: 0 8px 8px 0;
      margin-bottom: 1.5rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .markdown-body code {
      font-family: 'JetBrains Mono', monospace;
      background: var(--code-bg);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.875em;
      border: 1px solid var(--border-color);
      word-break: break-word;
    }

    .markdown-body pre {
      background: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.25rem;
      overflow-x: auto;
      margin-bottom: 1.5rem;
      max-width: 100%;
    }

    .markdown-body pre code {
      background: transparent;
      padding: 0;
      border: none;
      font-size: 0.875rem;
      word-break: normal;
    }

    /* Table Container for Mobile Responsiveness */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      -webkit-overflow-scrolling: touch;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel-bg);
      margin: 0;
    }

    .markdown-body th, .markdown-body td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      min-width: 120px;
    }

    .markdown-body th {
      background: var(--bg-color);
      font-weight: 600;
      color: var(--accent-color);
    }

    .markdown-body tr:nth-child(even) {
      background: var(--table-stripe);
    }

    .markdown-body hr {
      border: 0;
      height: 1px;
      background: var(--border-color);
      margin: 2.5rem 0;
    }

    .markdown-body strong {
      color: var(--accent-hover);
    }

    /* Mobile Menu Toggle Button */
    .mobile-menu-btn {
      display: none;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Responsive Breakpoints */
    @media (max-width: 1024px) {
      sidebar {
        transform: translateX(-100%);
      }

      sidebar.open {
        transform: translateX(0);
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.2);
      }

      .sidebar-overlay.open {
        display: block;
        opacity: 1;
      }

      main {
        margin-left: 0;
        width: 100%;
        padding: 2rem 1.5rem;
      }

      .mobile-menu-btn {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .search-box input {
        width: 160px;
      }

      .search-box input:focus {
        width: 200px;
      }
    }

    @media (max-width: 640px) {
      header {
        padding: 0 0.85rem;
      }

      .brand span {
        font-size: 1rem;
      }

      .search-box input {
        width: 120px;
        padding-left: 1.8rem;
        font-size: 0.8rem;
      }

      .search-box input:focus {
        width: 150px;
      }

      .btn-icon span#themeLabel {
        display: none;
      }

      main {
        padding: 1.25rem 1rem;
      }
    }
  </style>
</head>
<body data-theme="light">

  <!-- Passcode Protection Modal -->
  <div class="lock-overlay" id="lockOverlay">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <div class="lock-title">FemogNotes Locked</div>
      <div class="lock-subtitle">Enter your passcode to access and read the reference notes.</div>
      
      <form class="passcode-input-group" onsubmit="verifyPasscode(event)">
        <input type="password" id="passcodeInput" class="passcode-input" placeholder="Passcode" autofocus autocomplete="current-password">
        <button type="submit" class="passcode-btn">Unlock Notes</button>
      </form>
      
      <div class="error-msg" id="errorMsg">Incorrect passcode. Please try again.</div>
    </div>
  </div>

  <header>
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Toggle menu">☰</button>
      <div class="brand">
        <span class="brand-icon">🧠</span>
        <span>FemogNotes</span>
      </div>
    </div>

    <div class="header-actions">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" placeholder="Search notes..." onkeyup="filterContent()">
      </div>
      <button class="btn-icon" onclick="lockSite()" title="Lock Site">
        <span>🔒</span>
      </button>
      <button class="btn-icon" onclick="toggleTheme()" aria-label="Toggle theme">
        <span id="themeIcon">🌙</span>
        <span id="themeLabel">Dark</span>
      </button>
    </div>
  </header>

  <div class="app-container">
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <sidebar id="sidebar">
      <div class="toc-title">Table of Contents</div>
      <ul class="toc-list" id="tocList">
        <!-- Generated dynamically -->
      </ul>
    </sidebar>

    <main>
      <article class="markdown-body" id="content">
        <p style="color: var(--text-muted);">Loading FemogNotes...</p>
      </article>
    </main>
  </div>

  <script>
    // Passcode Verification System (Default Passcode: 4211)
    const DEFAULT_PASSCODE = '4211';

    function getStoredPasscode() {
      return localStorage.getItem('femog_passcode') || DEFAULT_PASSCODE;
    }

    function isSessionAuthenticated() {
      return sessionStorage.getItem('femog_authenticated') === 'true';
    }

    function checkAuthentication() {
      const lockOverlay = document.getElementById('lockOverlay');
      if (isSessionAuthenticated()) {
        lockOverlay.classList.add('hidden');
      } else {
        lockOverlay.classList.remove('hidden');
        document.getElementById('passcodeInput').focus();
      }
    }

    function verifyPasscode(event) {
      if (event) event.preventDefault();
      const input = document.getElementById('passcodeInput');
      const errorMsg = document.getElementById('errorMsg');
      const userPasscode = input.value.trim();

      if (userPasscode === getStoredPasscode()) {
        sessionStorage.setItem('femog_authenticated', 'true');
        document.getElementById('lockOverlay').classList.add('hidden');
        errorMsg.classList.remove('visible');
        input.value = '';
      } else {
        errorMsg.classList.add('visible');
        input.focus();
        input.select();
      }
    }

    function lockSite() {
      sessionStorage.removeItem('femog_authenticated');
      const lockOverlay = document.getElementById('lockOverlay');
      lockOverlay.classList.remove('hidden');
      document.getElementById('passcodeInput').value = '';
      document.getElementById('passcodeInput').focus();
    }

    // Theme toggle logic (Default: Light Mode)
    function toggleTheme() {
      const body = document.body;
      const currentTheme = body.getAttribute('data-theme');
      const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
      body.setAttribute('data-theme', nextTheme);
      
      document.getElementById('themeIcon').textContent = nextTheme === 'light' ? '🌙' : '☀️';
      document.getElementById('themeLabel').textContent = nextTheme === 'light' ? 'Dark' : 'Light';
      document.getElementById('hljs-theme').href = nextTheme === 'light'
        ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css'
        : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css';
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    // Helper to generate clean URL slug from heading text
    function slugify(text) {
      return text
        .toLowerCase()
        .replace(/[^\w\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-');
    }

    function renderMarkdown(markdownText) {
      const contentEl = document.getElementById('content');
      const tocListEl = document.getElementById('tocList');
      
      // Parse markdown to HTML
      contentEl.innerHTML = marked.parse(markdownText);

      // Wrap tables in responsive wrapper div
      contentEl.querySelectorAll('table').forEach(table => {
        const wrapper = document.createElement('div');
        wrapper.className = 'table-wrapper';
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      });

      // Apply syntax highlighting
      document.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });

      // Render KaTeX math formulas
      document.querySelectorAll('.markdown-body').forEach((el) => {
        el.innerHTML = el.innerHTML.replace(/\$([^\$]+)\$/g, (match, math) => {
          try {
            return katex.renderToString(math, { displayMode: false });
          } catch (e) {
            return match;
          }
        });
      });

      // Build Table of Contents and assign IDs to headings
      tocListEl.innerHTML = '';
      const headings = contentEl.querySelectorAll('h1, h2, h3');
      
      headings.forEach((heading, idx) => {
        const text = heading.textContent.trim();
        if (!text) return;

        // Generate clean ID
        const slug = slugify(text) || ('section-' + idx);
        heading.id = slug;

        // Add to sidebar TOC if h2 or h3
        if (heading.tagName === 'H2' || heading.tagName === 'H3') {
          const li = document.createElement('li');
          li.className = 'toc-item ' + (heading.tagName === 'H2' ? 'level-2' : 'level-3');
          
          const a = document.createElement('a');
          a.textContent = text;
          a.onclick = (e) => {
            e.preventDefault();
            const target = document.getElementById(slug);
            if (target) {
              target.scrollIntoView({ behavior: 'smooth', block: 'start' });
              history.pushState(null, null, '#' + slug);
            }
            if (window.innerWidth <= 1024) {
              toggleSidebar();
            }
          };

          li.appendChild(a);
          tocListEl.appendChild(li);
        }
      });

      // Intercept in-page anchor links for smooth scrolling
      contentEl.querySelectorAll('a[href^="#"]').forEach(a => {
        a.onclick = (e) => {
          const rawTargetId = a.getAttribute('href').substring(1);
          if (!rawTargetId) return;

          let target = document.getElementById(rawTargetId);
          if (!target) {
            headings.forEach(h => {
              if (slugify(h.textContent) === rawTargetId || h.id === rawTargetId) {
                target = h;
              }
            });
          }

          if (target) {
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.pushState(null, null, '#' + target.id);
          }
        };
      });
    }

    // Filter content on search
    function filterContent() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const elements = document.querySelectorAll('.markdown-body h2, .markdown-body h3, .markdown-body p, .markdown-body li, .markdown-body pre, .table-wrapper');
      
      if (!query) {
        elements.forEach(el => el.style.display = '');
        return;
      }

      elements.forEach(el => {
        const text = el.textContent.toLowerCase();
        if (text.includes(query)) {
          el.style.display = '';
        } else {
          el.style.display = 'none';
        }
      });
    }

    // Initialize Passcode Check on Load
    checkAuthentication();

    // Fetch markdown file
    fetch('ai_notes.md')
      .then(response => {
        if (!response.ok) throw new Error('Failed to load notes');
        return response.text();
      })
      .then(text => renderMarkdown(text))
      .catch(err => {
        console.error('Fetch error:', err);
      });
  </script>
</body>
</html>
